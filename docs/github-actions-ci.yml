name: RailPulse AI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt coverage pip-audit

      - name: Lint frontend
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc -b

      - name: Frontend unit & component tests
        run: npm test

      - name: Backend tests with coverage gate (>= 80%)
        run: |
          python -m coverage run --source=api -m unittest discover -s tests -v
          python -m coverage report --fail-under=80

      - name: Build production bundle
        run: npm run build

      - name: Dependency vulnerability checks
        run: |
          npm audit --audit-level=high
          pip-audit -r requirements.txt
